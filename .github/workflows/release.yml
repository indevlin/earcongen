name: Release

# Builds one single-file GUI binary per operating system.
#
# LGPLv3 4(d)(1) is satisfied by publishing the complete source and the
# build spec in packaging/; licenses/ ships inside every archive, as
# 4(b) requires. Only the GUI is frozen; the command-line tools travel
# in each archive as source.

on:
  push:
    # Bare YYYYMMDD datestamps, no "v" prefix. The verify job rejects a
    # tag that does not match the version file.
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artefacts without publishing a release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify tag matches the version file
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read and check the version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version file: ${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "${VERSION}" ]; then
              echo "::error::Tag '${TAG}' does not match the version file" \
                   "('${VERSION}'). Tags are bare datestamps with no 'v'" \
                   "prefix. Update 'version' or move the tag."
              exit 1
            fi
          fi

  test:
    name: Tests and audio regression
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 xvfb

      - name: Lint
        run: ruff check .

      # The GUI tests build real widgets, so they need a platform
      # plugin; offscreen needs no display.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests

      # Droid output is ring-modulated, so its envelope nulls need the
      # looser --modulated limit.
      - name: Generate and check every family
        run: |
          set -euo pipefail
          for family in core ui system message progress; do
            python earcongen.py --family "$family" --out "audio/$family"
          done
          python earcongen.py --r2 --out audio/r2
          python earcongen.py --r2-full --out audio/r2-full
          python earconcheck.py audio/core/*.wav audio/ui/*.wav \
            audio/system/*.wav audio/message/*.wav audio/progress/*.wav
          python earconcheck.py --modulated audio/r2/*.wav audio/r2-full/*.wav

  build:
    name: Build (${{ matrix.os }})
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-arm64

    # Signing secrets must be declared at job level: a step's own `env:`
    # is not available to that step's `if:`, so a step-level reference
    # evaluates false and signing is skipped without any error.
    env:
      BINARY: EarconGen
      WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0

      - name: Build single-file binary
        run: pyinstaller packaging/earcongen.spec --noconfirm --clean

      # Code signing. Each step is skipped when its secret is absent, so
      # a fork builds with no credentials configured.

      - name: Sign Windows binary
        if: runner.os == 'Windows' && env.WINDOWS_CERT != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT)
          $path = Join-Path $env:RUNNER_TEMP "earcongen-signing.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $signtool = Get-ChildItem `
            "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" |
            Select-Object -Last 1
          & $signtool.FullName sign /f $path /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist/$env:BINARY.exe"
          & $signtool.FullName verify /pa "dist/$env:BINARY.exe"
          Remove-Item $path -Force

      - name: Sign and notarise macOS app
        if: runner.os == 'macOS' && env.MACOS_CERT != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/earcongen.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # Notarisation requires the hardened runtime. Qt loads plugins
          # at runtime, so the JIT and unsigned-memory entitlements are
          # required or the app is killed at launch.
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "dist/${BINARY}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${BINARY}.app"

          ditto -c -k --keepParent "dist/${BINARY}.app" \
            "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          xcrun stapler staple "dist/${BINARY}.app"

          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notarize.zip"

      # Smoke test: catches a binary that builds but cannot import its
      # own modules. --cli version never imports Qt, so needs no display.

      - name: Smoke-test the binary (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          chmod +x "dist/${BINARY}"
          ACTUAL="$("dist/${BINARY}" --cli version)"
          EXPECTED="${{ needs.verify.outputs.version }}"
          echo "reported: '$ACTUAL' / expected: '$EXPECTED'"
          test -n "$ACTUAL" || { echo "::error::No output from the binary."; exit 1; }
          test "$ACTUAL" = "$EXPECTED"

      # The Windows binary is windowed, so gui/win_console.py reattaches
      # stdout for --cli. Two capture methods are tried: a pipe, which
      # exercises console attachment, then a file redirect, which
      # exercises the inherited-handle path.
      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "${{ needs.verify.outputs.version }}"
          $exe = "dist/$env:BINARY.exe"

          $actual = (& $exe --cli version 2>&1 | Out-String).Trim()
          $exit = $LASTEXITCODE
          Write-Host "pipe capture : '$actual' (exit $exit)"

          if ([string]::IsNullOrWhiteSpace($actual)) {
            Write-Host "Pipe capture was empty; retrying with a file redirect."
            $tmp = Join-Path $env:RUNNER_TEMP "earcongen-version.txt"
            & $exe --cli version > $tmp 2>&1
            $exit = $LASTEXITCODE
            $actual = (Get-Content $tmp -Raw).Trim()
            Write-Host "file capture : '$actual' (exit $exit)"
          }

          if ($exit -ne 0) {
            throw "Binary exited with code $exit."
          }
          if ([string]::IsNullOrWhiteSpace($actual)) {
            throw ("The binary produced no output by either method. A " +
                   "windowed Windows build cannot write to stdout unless " +
                   "it attaches to the parent console or picks up an " +
                   "inherited handle - check enable_console_output() in " +
                   "gui/win_console.py.")
          }
          if ($actual -ne $expected) {
            throw "Version mismatch: got '$actual', expected '$expected'."
          }
          Write-Host "OK"

      # Only a tagged run archives. A manual run uploads loose files,
      # since upload-artifact zips its input either way.
      - name: Package artefacts
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          STEM="${BINARY}-${VERSION}-${{ matrix.platform }}"

          # Licence texts, as LGPLv3 4(b) requires, plus the two
          # command-line tools.
          EXTRAS="LICENSE THIRD-PARTY-NOTICES.md README.md USAGE.md \
                  CHANGELOG.md earcongen.py earconcheck.py licenses"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a "dist/${STEM}.zip" "./dist/${BINARY}.exe" ${EXTRAS// /' ./'}
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            ditto -c -k --keepParent "dist/${BINARY}.app" \
              "dist/${STEM}.zip" 2>/dev/null || \
              tar -czf "dist/${STEM}.tar.gz" -C dist "${BINARY}" -C .. ${EXTRAS}
          else
            tar -czf "dist/${STEM}.tar.gz" -C dist "${BINARY}" -C .. ${EXTRAS}
          fi

          cd dist
          for f in "${STEM}".*; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" >> "SHA256SUMS-${STEM}.txt"
            else
              shasum -a 256 "$f" >> "SHA256SUMS-${STEM}.txt"
            fi
          done
          ls -la

      - name: Collect artefacts (manual run)
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE THIRD-PARTY-NOTICES.md dist/
          cp -R licenses dist/
          ls -la dist

      # Archive and checksum only; dist/ also holds the loose binary,
      # which carries no licence texts beside it.
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: EarconGen-${{ matrix.platform }}
          path: |
            dist/EarconGen-${{ needs.verify.outputs.version }}-*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: EarconGen-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !inputs.dry_run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt || true
          rm -f SHA256SUMS-*.txt
          ls -la

      - name: Extract release notes from the changelog
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          # Pull the section for this version out of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for ${VERSION}." > release-notes.md
          fi
          cat release-notes.md

      # Org policy permits only actions owned by indevlin or authored by
      # GitHub, so the release is cut with gh, which ships on the runner.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          ASSETS=(artifacts/*)
          shopt -u nullglob
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No artefacts to attach."
            exit 1
          fi
          printf '  %s\n' "${ASSETS[@]}"

          # A suffix such as 20260908-rc1 marks a prerelease; a bare
          # datestamp is a full release.
          FLAGS=()
          case "$VERSION" in
            *-*) FLAGS+=(--prerelease) ;;
          esac

          # A re-run finds the release present, so edit and clobber
          # rather than fail.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file release-notes.md "${FLAGS[@]}"
            gh release upload "$VERSION" "${ASSETS[@]}" --clobber
          else
            gh release create "$VERSION" "${ASSETS[@]}" \
              --title "$VERSION" --notes-file release-notes.md "${FLAGS[@]}"
          fi

# Run by the release workflow before it builds. Correctness rules only.

line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "UP", "RUF"]
ignore = [
    # Redundant int() casts mark values that are only int-typed in one
    # branch.
    "RUF046",
    # Allows `command + [path]` for building argument lists.
    "RUF005",
]

[lint.per-file-ignores]
# Both insert the repository root on sys.path before importing from it.
"earcongui.py" = ["E402"]
"tests/*" = ["E402"]
# Analysis, PYZ, EXE and BUNDLE are injected by PyInstaller at exec time.
"packaging/*.spec" = ["F821", "E402"]
